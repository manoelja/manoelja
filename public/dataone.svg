<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06d6a0"/>
    </linearGradient>
    
    <!-- Glow gradient -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    
    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00f5ff" flood-opacity="0.4"/>
    </filter>
    
    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Pulse animation -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .pulse-ring { animation: pulse 3s ease-in-out infinite; }
      .rotate-slow { animation: rotate 20s linear infinite; transform-origin: center; }
      .float { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Background circle with glow -->
  <circle cx="200" cy="200" r="180" fill="url(#innerGlow)" opacity="0.5"/>
  
  <!-- Outer rotating ring -->
  <g class="rotate-slow">
    <circle cx="200" cy="200" r="170" fill="none" stroke="url(#mainGradient)" stroke-width="1" stroke-dasharray="10 5" opacity="0.4"/>
  </g>
  
  <!-- Pulse rings -->
  <circle class="pulse-ring" cx="200" cy="200" r="150" fill="none" stroke="url(#glowGradient)" stroke-width="2" opacity="0.3"/>
  <circle class="pulse-ring" cx="200" cy="200" r="130" fill="none" stroke="url(#glowGradient)" stroke-width="1.5" opacity="0.2" style="animation-delay: 0.5s"/>
  
  <!-- Main hexagon shape -->
  <g class="float" filter="url(#shadow)">
    <path d="M200 80 L280 130 L280 230 L200 280 L120 230 L120 130 Z" 
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="3"
          stroke-linejoin="round"/>
    
    <!-- Inner hexagon -->
    <path d="M200 100 L260 140 L260 220 L200 260 L140 220 L140 140 Z" 
          fill="url(#innerGlow)" 
          stroke="url(#mainGradient)" 
          stroke-width="1.5"
          stroke-linejoin="round"
          opacity="0.6"/>
  </g>
  
  <!-- Data visualization bars -->
  <g class="float" style="animation-delay: 0.2s">
    <!-- Bar 1 -->
    <rect x="160" y="180" width="12" height="60" rx="6" fill="url(#mainGradient)" opacity="0.8"/>
    <!-- Bar 2 -->
    <rect x="180" y="160" width="12" height="80" rx="6" fill="url(#mainGradient)" opacity="0.9"/>
    <!-- Bar 3 -->
    <rect x="200" y="140" width="12" height="100" rx="6" fill="url(#mainGradient)"/>
    <!-- Bar 4 -->
    <rect x="220" y="170" width="12" height="70" rx="6" fill="url(#mainGradient)" opacity="0.85"/>
  </g>
  
  <!-- Number "1" stylized -->
  <g class="float" style="animation-delay: 0.4s">
    <text x="200" y="220" 
          font-family="Arial, sans-serif" 
          font-size="72" 
          font-weight="bold" 
          fill="url(#mainGradient)" 
          text-anchor="middle" 
          dominant-baseline="middle"
          filter="url(#shadow)">1</text>
  </g>
  
  <!-- Floating data points -->
  <circle cx="100" cy="150" r="4" fill="#00f5ff" opacity="0.6" class="float" style="animation-delay: 0.1s"/>
  <circle cx="300" cy="120" r="3" fill="#8b5cf6" opacity="0.5" class="float" style="animation-delay: 0.3s"/>
  <circle cx="80" cy="250" r="3" fill="#06d6a0" opacity="0.5" class="float" style="animation-delay: 0.6s"/>
  <circle cx="320" cy="280" r="4" fill="#00f5ff" opacity="0.6" class="float" style="animation-delay: 0.8s"/>
  
  <!-- Connection lines -->
  <line x1="100" y1="150" x2="150" y2="180" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="120" x2="250" y2="160" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="250" x2="140" y2="220" stroke="#06d6a0" stroke-width="1" opacity="0.3"/>
  <line x1="320" y1="280" x2="260" y2="230" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>
  
  <!-- Text label -->
  <text x="200" y="340" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="url(#mainGradient)" 
        text-anchor="middle"
        letter-spacing="4">DATAONE</text>
  
  <!-- Subtle tagline -->
  <text x="200" y="365" 
        font-family="Arial, sans-serif" 
        font-size="10" 
        fill="#8b5cf6" 
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.7">INTELLIGENT DATA</text>
</svg>