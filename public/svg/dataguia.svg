<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-12px); }
      }
      @keyframes drift {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(3px, -2px); }
        50%  { transform: translate(-1px, 3px); }
        75%  { transform: translate(2px, -1px); }
        100% { transform: translate(0, 0); }
      }

      .logo-float { animation: float 4s ease-in-out infinite; }
      .star-drift circle { animation: drift 8s ease-in-out infinite; }
      .star-drift circle:nth-child(3n)   { animation-delay: -2s; animation-duration: 10s; }
      .star-drift circle:nth-child(3n+1) { animation-delay: -4s; animation-duration: 6s; }
      .star-drift path { animation: drift 7s ease-in-out infinite; animation-delay: -3s; }
    </style>

    <!-- Gradients from dataguia.svg -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4d8c" />
      <stop offset="50%" stop-color="#0d2b5c" />
      <stop offset="100%" stop-color="#051533" />
    </linearGradient>

    <linearGradient id="facetTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#18407d" />
      <stop offset="100%" stop-color="#38b6ff" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13366b" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#13366b" />
      <stop offset="100%" stop-color="#0288d1" />
    </linearGradient>

    <linearGradient id="facetBottom" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0d2b5c" />
      <stop offset="100%" stop-color="#024480" />
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38b6ff" />
      <stop offset="50%" stop-color="#1e7ed6" />
      <stop offset="100%" stop-color="#0d4a8c" />
    </linearGradient>

    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

