  <defs>
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4d8c" />
      <stop offset="50%" stop-color="#0d2b5c" />
      <stop offset="100%" stop-color="#051533" />
    </linearGradient>

    <linearGradient id="facetTop" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#18407d" />
      <stop offset="100%" stop-color="#38b6ff" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="100%" y1="0%" x2="0%" y2="100%">
