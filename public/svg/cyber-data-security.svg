<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Escudo Interno -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#aa0011" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#220000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Efeito de Brilho (Glow Effect) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ─── GRUPO FLUTUANTE (FLOATING) ─── -->
  <g>
    <!-- Flutuação suave vertical -->
    <animateTransform
      attributeName="transform" type="translate"
      values="0,0; 0,-18; 0,0; 0,-10; 0,0"
      dur="7s" repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"
    />

    <!-- Estrelas em Órbita - Órbita 1 (vertical) -->
    <g fill="#ff3344" filter="url(#soft-glow)">
      <circle cx="0" cy="0" r="2.5">
        <animateMotion path="M400,60 A90,340 0 1,1 400,740 A90,340 0 1,1 400,60" dur="10s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="2">
        <animateMotion path="M400,740 A90,340 0 1,1 400,60 A90,340 0 1,1 400,740" dur="10s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" begin="1s" />
      </circle>
      <circle cx="0" cy="0" r="1.8">
        <animateMotion path="M490,400 A90,340 0 1,1 310,400 A90,340 0 1,1 490,400" dur="10s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite" begin="0.5s" />
      </circle>
      <circle cx="0" cy="0" r="2.2">
        <animateMotion path="M310,400 A90,340 0 1,1 490,400 A90,340 0 1,1 310,400" dur="10s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" begin="1.5s" />
      </circle>
    </g>

    <!-- Estrelas em Órbita - Órbita 2 (rotacionada -60°) -->
    <g transform="rotate(-60 400 400)" fill="#ff5566" filter="url(#soft-glow)">
      <circle cx="0" cy="0" r="2.2">
        <animateMotion path="M400,60 A90,340 0 1,1 400,740 A90,340 0 1,1 400,60" dur="14s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="1.8">
        <animateMotion path="M400,740 A90,340 0 1,1 400,60 A90,340 0 1,1 400,740" dur="14s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" begin="0.7s" />
      </circle>
      <circle cx="0" cy="0" r="2">
        <animateMotion path="M490,400 A90,340 0 1,1 310,400 A90,340 0 1,1 490,400" dur="14s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1.4s" />
      </circle>
    </g>

    <!-- Estrelas em Órbita - Órbita 3 (rotacionada +60°) -->
    <g transform="rotate(60 400 400)" fill="#ff2244" filter="url(#soft-glow)">
      <circle cx="0" cy="0" r="2">
        <animateMotion path="M400,60 A90,340 0 1,1 400,740 A90,340 0 1,1 400,60" dur="18s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="2.5">
        <animateMotion path="M400,740 A90,340 0 1,1 400,60 A90,340 0 1,1 400,740" dur="18s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite" begin="0.9s" />
      </circle>
      <circle cx="0" cy="0" r="1.5">
        <animateMotion path="M490,400 A90,340 0 1,1 310,400 A90,340 0 1,1 490,400" dur="18s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.8s" repeatCount="indefinite" begin="1.8s" />
      </circle>
    </g>

    <!-- Órbitas Elípticas Estilo Átomo / Tecno (estáticas) -->
    <g stroke="#ff0033" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#glow)">
      <ellipse cx="400" cy="400" rx="90" ry="340" />
      <ellipse cx="400" cy="400" rx="90" ry="340" transform="rotate(-60 400 400)" />
      <ellipse cx="400" cy="400" rx="90" ry="340" transform="rotate(60 400 400)" />
    </g>

    <!-- Escudo Central -->
    <g filter="url(#glow)">
      <polygon points="400,180 580,260 540,540 400,630 260,540 220,260" 
               fill="url(#shield-grad)" stroke="#ff0033" stroke-width="2.5" />
               
      <!-- Borda Interna Dupla do Escudo (estática) -->
      <polygon points="400,205 555,275 520,525 400,605 280,525 245,275" 
               fill="none" stroke="#ff3355" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Malha Geométrica Intensa -->
    <g stroke="#ff1a40" stroke-width="1.2" opacity="0.75" filter="url(#soft-glow)">
      <line x1="400" y1="180" x2="330" y2="250" />
      <line x1="400" y1="180" x2="470" y2="250" />
      <line x1="220" y1="260" x2="310" y2="330" />
      <line x1="580" y1="260" x2="490" y2="330" />
      <line x1="260" y1="540" x2="350" y2="450" />
      <line x1="540" y1="540" x2="450" y2="450" />
      <line x1="400" y1="630" x2="400" y2="520" />
      
      <line x1="330" y1="250" x2="470" y2="250" />
      <line x1="330" y1="250" x2="400" y2="310" />
      <line x1="470" y1="250" x2="400" y2="310" />
      
      <line x1="310" y1="330" x2="400" y2="310" />
      <line x1="490" y1="330" x2="400" y2="310" />
      
      <line x1="310" y1="330" x2="330" y2="410" />
      <line x1="490" y1="330" x2="470" y2="410" />
      
      <line x1="400" y1="310" x2="330" y2="410" />
      <line x1="400" y1="310" x2="470" y2="410" />
      <line x1="400" y1="310" x2="400" y2="390" />
      
      <line x1="330" y1="410" x2="400" y2="390" />
      <line x1="470" y1="410" x2="400" y2="390" />
      <line x1="330" y1="410" x2="350" y2="450" />
      <line x1="470" y1="410" x2="450" y2="450" />
      <line x1="400" y1="390" x2="400" y2="470" />
      
      <line x1="350" y1="450" x2="400" y2="470" />
      <line x1="450" y1="450" x2="400" y2="470" />
      <line x1="350" y1="450" x2="400" y2="520" />
      <line x1="450" y1="450" x2="400" y2="520" />
      
      <line x1="330" y1="250" x2="310" y2="330" />
      <line x1="470" y1="250" x2="490" y2="330" />
      <line x1="330" y1="410" x2="470" y2="410" />
      <line x1="280" y1="390" x2="330" y2="410" />
      <line x1="520" y1="390" x2="470" y2="410" />
      <line x1="280" y1="390" x2="310" y2="330" />
      <line x1="520" y1="390" x2="490" y2="330" />
      <line x1="280" y1="390" x2="350" y2="450" />
      <line x1="520" y1="390" x2="450" y2="450" />
      <line x1="400" y1="470" x2="400" y2="630" />
    </g>

    <!-- Núcleo Brilhante de Energia no Centro (pulsante) -->
    <g filter="url(#intense-glow)">
      <circle cx="400" cy="390" r="25" fill="#ff0033" opacity="0.4">
        <animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="400" cy="390" r="10" fill="#ffffff" opacity="0.8">
        <animate attributeName="r" values="8;13;8" dur="2.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Vértices / Pontos de Conexão (estáticos) -->
    <g fill="#ffffff" filter="url(#soft-glow)">
      <circle cx="400" cy="180" r="3.5" />
      <circle cx="330" cy="250" r="3" />
      <circle cx="470" cy="250" r="3" />
      <circle cx="310" cy="330" r="3.5" />
      <circle cx="490" cy="330" r="3.5" />
      <circle cx="400" cy="310" r="4" />
      <circle cx="280" cy="390" r="3" />
      <circle cx="520" cy="390" r="3" />
      <circle cx="330" cy="410" r="3.5" />
      <circle cx="470" cy="410" r="3.5" />
      <circle cx="400" cy="390" r="4.5" />
      <circle cx="350" cy="450" r="3.5" />
      <circle cx="450" cy="450" r="3.5" />
      <circle cx="400" cy="470" r="4" />
      <circle cx="400" cy="520" r="3.5" />
      <circle cx="260" cy="540" r="3" />
      <circle cx="540" cy="540" r="3" />
      <circle cx="400" cy="630" r="4" />
    </g>

    <!-- Flares de Luz (estáticos) -->
    <g fill="#ffffff" filter="url(#glow)">
      <circle cx="400" cy="310" r="2" />
      <circle cx="400" cy="390" r="2.5" />
      <circle cx="400" cy="470" r="2" />
    </g>
  </g>
</svg>
