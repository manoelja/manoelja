<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gradiente do Escudo Interno -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#aa0011" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#220000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Efeito de Brilho (Glow Effect) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intense-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Partículas de Fundo Distribuídas -->
  <g fill="#ff3344" opacity="0.6" filter="url(#soft-glow)">
    <circle cx="150" cy="200" r="2" />
    <circle cx="680" cy="180" r="2.5" />
    <circle cx="230" cy="650" r="1.5" />
    <circle cx="620" cy="600" r="2" />
    <circle cx="120" cy="480" r="2" />
    <circle cx="720" cy="350" r="1.8" />
    <circle cx="280" cy="120" r="2" />
    <circle cx="550" cy="720" r="2.2" />
    <circle cx="180" cy="320" r="1.5" />
    <circle cx="640" cy="440" r="2" />
  </g>

  <!-- Órbitas Elípticas Estilo Átomo / Tecno -->
  <g stroke="#ff0033" stroke-width="1.5" fill="none" opacity="0.8" filter="url(#glow)">
    <!-- Órbita Vertical -->
    <ellipse cx="400" cy="400" rx="90" ry="340" />
    <!-- Órbita Inclinada Esquerda -->
    <ellipse cx="400" cy="400" rx="90" ry="340" transform="rotate(-60 400 400)" />
    <!-- Órbita Inclinada Direita -->
    <ellipse cx="400" cy="400" rx="90" ry="340" transform="rotate(60 400 400)" />
  </g>

  <!-- Pontos Brilhantes nas Órbitas -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="400" cy="60" r="4" />
    <circle cx="130" cy="240" r="4" />
    <circle cx="670" cy="240" r="4" />
    <circle cx="220" cy="510" r="3" />
    <circle cx="580" cy="510" r="3" />
    <circle cx="308" cy="180" r="3.5" />
  </g>

  <!-- Escudo Central -->
  <g filter="url(#glow)">
    <!-- Fundo Preenchido do Escudo -->
    <polygon points="400,180 580,260 540,540 400,630 260,540 220,260" 
             fill="url(#shield-grad)" stroke="#ff0033" stroke-width="2.5" />
             
    <!-- Borda Interna Dupla do Escudo -->
    <polygon points="400,205 555,275 520,525 400,605 280,525 245,275" 
             fill="none" stroke="#ff3355" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Malha Geométrica Intensa (Sem Fechadura) -->
  <g stroke="#ff1a40" stroke-width="1.2" opacity="0.75" filter="url(#soft-glow)">
    <!-- Conexões Externas para Internas -->
    <line x1="400" y1="180" x2="330" y2="250" />
    <line x1="400" y1="180" x2="470" y2="250" />
    <line x1="220" y1="260" x2="310" y2="330" />
    <line x1="580" y1="260" x2="490" y2="330" />
    <line x1="260" y1="540" x2="350" y2="450" />
    <line x1="540" y1="540" x2="450" y2="450" />
    <line x1="400" y1="630" x2="400" y2="520" />
    
    <!-- Redes Intermediárias do Centro -->
    <line x1="330" y1="250" x2="470" y2="250" />
    <line x1="330" y1="250" x2="400" y2="310" />
    <line x1="470" y1="250" x2="400" y2="310" />
    
    <line x1="310" y1="330" x2="400" y2="310" />
    <line x1="490" y1="330" x2="400" y2="310" />
    
    <line x1="310" y1="330" x2="330" y2="410" />
    <line x1="490" y1="330" x2="470" y2="410" />
    
    <line x1="400" y1="310" x2="330" y2="410" />
    <line x1="400" y1="310" x2="470" y2="410" />
    <line x1="400" y1="310" x2="400" y2="390" />
    
    <!-- Centro do Plexo -->
    <line x1="330" y1="410" x2="400" y2="390" />
    <line x1="470" y1="410" x2="400" y2="390" />
    <line x1="330" y1="410" x2="350" y2="450" />
    <line x1="470" y1="410" x2="450" y2="450" />
    <line x1="400" y1="390" x2="400" y2="470" />
    
    <line x1="350" y1="450" x2="400" y2="470" />
    <line x1="450" y1="450" x2="400" y2="470" />
    <line x1="350" y1="450" x2="400" y2="520" />
    <line x1="450" y1="450" x2="400" y2="520" />
    
    <!-- Linhas Transversais Adicionais -->
    <line x1="330" y1="250" x2="310" y2="330" />
    <line x1="470" y1="250" x2="490" y2="330" />
    <line x1="330" y1="410" x2="470" y2="410" />
    <line x1="280" y1="390" x2="330" y2="410" />
    <line x1="520" y1="390" x2="470" y2="410" />
    <line x1="280" y1="390" x2="310" y2="330" />
    <line x1="520" y1="390" x2="490" y2="330" />
    <line x1="280" y1="390" x2="350" y2="450" />
    <line x1="520" y1="390" x2="450" y2="450" />
    <line x1="400" y1="470" x2="400" y2="630" />
  </g>

  <!-- Núcleo Brilhante de Energia no Centro -->
  <g filter="url(#intense-glow)">
    <circle cx="400" cy="390" r="25" fill="#ff0033" opacity="0.4" />
    <circle cx="400" cy="390" r="10" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Vértices / Pontos de Conexão -->
  <g fill="#ffffff" filter="url(#soft-glow)">
    <circle cx="400" cy="180" r="3.5" />
    <circle cx="330" cy="250" r="3" />
    <circle cx="470" cy="250" r="3" />
    <circle cx="310" cy="330" r="3.5" />
    <circle cx="490" cy="330" r="3.5" />
    <circle cx="400" cy="310" r="4" />
    <circle cx="280" cy="390" r="3" />
    <circle cx="520" cy="390" r="3" />
    <circle cx="330" cy="410" r="3.5" />
    <circle cx="470" cy="410" r="3.5" />
    <circle cx="400" cy="390" r="4.5" />
    <circle cx="350" cy="450" r="3.5" />
    <circle cx="450" cy="450" r="3.5" />
    <circle cx="400" cy="470" r="4" />
    <circle cx="400" cy="520" r="3.5" />
    <circle cx="260" cy="540" r="3" />
    <circle cx="540" cy="540" r="3" />
    <circle cx="400" cy="630" r="4" />
  </g>

  <!-- Flares de Luz -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="400" cy="310" r="2" />
    <circle cx="400" cy="390" r="2.5" />
    <circle cx="400" cy="470" r="2" />
  </g>
</svg>
