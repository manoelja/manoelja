<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" width="1254" height="1254" fill="none">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CC74B"/>
      <stop offset="30%" stop-color="#6DA634"/>
      <stop offset="60%" stop-color="#04459C"/>
      <stop offset="100%" stop-color="#17B35C"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04459C"/>
      <stop offset="100%" stop-color="#0652B8"/>
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CC74B"/>
      <stop offset="100%" stop-color="#17B35C"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9CC74B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#04459C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#17B35C" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#04459C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#9CC74B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#04459C" flood-opacity="0.3"/>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rotateReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(10px); }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.15; transform: scale(0.95); }
        50% { opacity: 0.3; transform: scale(1.05); }
      }
      .logo-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 627px 627px; }
      .rotate-slow { animation: rotate 25s linear infinite; transform-origin: 627px 627px; }
      .rotate-medium { animation: rotate 15s linear infinite; transform-origin: 627px 627px; }
      .rotate-reverse { animation: rotateReverse 20s linear infinite; transform-origin: 627px 627px; }
      .float { animation: float 5s ease-in-out infinite; }
      .float-reverse { animation: floatReverse 5s ease-in-out infinite; }
      .breathe { animation: breathe 3s ease-in-out infinite; transform-origin: 627px 627px; }
      .delay-1 { animation-delay: 0.5s; }
      .delay-2 { animation-delay: 1s; }
      .delay-3 { animation-delay: 1.5s; }
      .light-green { fill: #9CC74B; }
      .mid-green { fill: #6DA634; }
      .blue { fill: #04459C; }
      .dark-green { fill: #17B35C; }
    </style>
  </defs>
  <circle cx="627" cy="627" r="550" fill="url(#innerGlow)" class="breathe"/>
  <circle cx="627" cy="627" r="500" fill="url(#pulseGlow)" class="breathe delay-2"/>
  <g class="rotate-slow">
    <circle cx="627" cy="627" r="580" fill="none" stroke="url(#mainGradient)" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.25"/>
  </g>
  <g class="rotate-reverse">
    <circle cx="627" cy="627" r="560" fill="none" stroke="url(#greenGradient)" stroke-width="1" stroke-dasharray="6 12" opacity="0.2"/>
  </g>
  <g class="rotate-medium delay-1">
    <circle cx="627" cy="627" r="540" fill="none" stroke="url(#blueGradient)" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.3"/>
  </g>
  <circle cx="627" cy="627" r="500" fill="none" stroke="url(#mainGradient)" stroke-width="2" opacity="0.15" class="breathe"/>
  <circle cx="627" cy="627" r="470" fill="none" stroke="url(#greenGradient)" stroke-width="1.5" opacity="0.1" class="breathe delay-3"/>
  <g class="float">
    <circle cx="150" cy="200" r="6" class="light-green" opacity="0.5"/>
  </g>
  <g class="float delay-1">
    <circle cx="1100" cy="180" r="5" class="dark-green" opacity="0.4"/>
  </g>
  <g class="float delay-2">
    <circle cx="200" cy="1000" r="7" class="blue" opacity="0.4"/>
  </g>
  <g class="float delay-3">
    <circle cx="1050" cy="1050" r="5" class="mid-green" opacity="0.5"/>
  </g>
  <g class="float-reverse delay-1">
    <circle cx="100" cy="600" r="4" class="dark-green" opacity="0.3"/>
  </g>
  <g class="float-reverse delay-3">
    <circle cx="1150" cy="650" r="4" class="light-green" opacity="0.3"/>
  </g>
  <line x1="150" y1="200" x2="350" y2="350" stroke="#9CC74B" stroke-width="1.5" opacity="0.12" stroke-dasharray="4 4"/>
  <line x1="1100" y1="180" x2="900" y2="350" stroke="#17B35C" stroke-width="1.5" opacity="0.12" stroke-dasharray="4 4"/>
  <line x1="200" y1="1000" x2="400" y2="850" stroke="#04459C" stroke-width="1.5" opacity="0.12" stroke-dasharray="4 4"/>
  <line x1="1050" y1="1050" x2="850" y2="850" stroke="#6DA634" stroke-width="1.5" opacity="0.12" stroke-dasharray="4 4"/>
