<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0b0713" />
    </radialGradient>

    <!-- Main Card Gradient -->
    <linearGradient id="purple-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Small Card Gradient -->
    <linearGradient id="small-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b4e" />
      <stop offset="100%" stop-color="#160d29" />
    </linearGradient>

    <!-- Soft Glow Filter optimized for low resolution -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>



  <g transform="translate(0, -1)">
    <!-- Orbiting Organic Rings (Thicker stroke-width for small dimensions) -->
    <path d="M 16 7 C 23.2 6.6 26 11 25.6 17 C 25.2 23 20 26.2 15.2 25.8 C 9.6 25.4 6.4 20.6 6.8 15 C 7.2 9.4 10.4 7.4 16 7 Z" 
          fill="none" stroke="#6d28d9" stroke-width="0.3" opacity="0.6" />

    <path d="M 16.8 6.2 C 24.4 7 26.8 12.6 25.2 18.2 C 23.6 23.8 17.6 26.6 13.6 25 C 8.4 23 5.6 17.4 7.2 11 C 8.4 7 12 5.8 16.8 6.2 Z" 
          fill="none" stroke="#4c1d95" stroke-width="0.25" opacity="0.7" />

    <path d="M 15.2 7.6 C 22 7.2 24.8 11.4 24.4 16.6 C 24 21.8 19.2 25 14.8 24.6 C 10 24.2 7.4 19.8 7.8 14.6 C 8.2 9.8 10.8 8 15.2 7.6 Z" 
          fill="none" stroke="#8b5cf6" stroke-width="0.2" opacity="0.5" />

    <!-- Top Left Icon Container (Book / Knowledge) -->
    <g transform="translate(7.2, 6)">
      <rect x="0" y="0" width="3.4" height="3.4" rx="1" fill="url(#small-card)" stroke="#4c1d95" stroke-width="0.2" />
      <!-- Book Icon -->
      <path d="M 1.1 1.4 C 1.3 1.3 1.5 1.3 1.7 1.4 C 1.9 1.3 2.1 1.3 2.3 1.4 V 2.3 C 2.1 2.2 1.9 2.2 1.7 2.3 C 1.5 2.2 1.3 2.2 1.1 2.3 Z M 1.7 1.4 V 2.3" 
            fill="none" stroke="#c4b5fd" stroke-width="0.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Central Glowing Card -->
    <!-- Card Backing Glow -->
    <rect x="11.6" y="11.6" width="8.8" height="8.8" rx="2.4" fill="#7c3aed" opacity="0.35" filter="url(#soft-glow)" />

    <!-- Main Card Body -->
    <rect x="11.6" y="11.6" width="8.8" height="8.8" rx="2.4" fill="url(#purple-card)" />

    <!-- Sparkle / AI Star Symbol inside Central Card -->
    <g transform="translate(16, 16)">
      <!-- 4-Pointed Curved Star -->
      <path d="M 0 -1.68 C 0.08 -0.48 0.48 -0.08 1.68 0 C 0.48 0.08 0.08 0.48 0 1.68 C -0.08 0.48 -0.48 0.08 -1.68 0 C -0.48 -0.08 -0.08 -0.48 0 -1.68 Z" 
            fill="none" stroke="#ffffff" stroke-width="0.3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Top-Right Plus Symbol -->
      <path d="M 1.12 -1.12 L 1.6 -1.12 M 1.36 -1.36 L 1.36 -0.88" 
            fill="none" stroke="#ffffff" stroke-width="0.2" stroke-linecap="round" />

      <!-- Bottom-Left Circle -->
      <circle cx="-1.2" cy="1.2" r="0.25" fill="#ffffff" />
    </g>
  </g>
</svg>
